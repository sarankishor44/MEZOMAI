version: '3.9'

services:

  # ── REACT FRONTEND ──────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aria_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
    environment:
      - VITE_PHP_API=http://localhost:8000/api
      - VITE_PYTHON_API=http://localhost:8001
      - VITE_WS_URL=ws://localhost:8001
    depends_on:
      - php
      - python
    networks:
      - aria_net

  # ── PHP LARAVEL BACKEND ─────────────────────────
  php:
    build:
      context: ./backend-php
      dockerfile: Dockerfile
    container_name: aria_php
    ports:
      - "8000:80"
    volumes:
      - ./backend-php:/var/www/html
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-aria_platform}
      - DB_USERNAME=${DB_USERNAME:-aria_user}
      - DB_PASSWORD=${DB_PASSWORD:-aria_secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=aria_aes256_key_change_in_prod_32ch
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - aria_net

  # ── PYTHON FASTAPI BACKEND ──────────────────────
  python:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: aria_python
    ports:
      - "8001:8001"
    volumes:
      - ./backend-python:/app
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-aria_platform}
      - DB_USERNAME=${DB_USERNAME:-aria_user}
      - DB_PASSWORD=${DB_PASSWORD:-aria_secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PHP_API_URL=http://php/api
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - APP_ENV=${APP_ENV:-production}
      - MEETING_BOT_PROVIDER=${MEETING_BOT_PROVIDER:-meetingbaas}
      - MEETINGBAAS_API_KEY=${MEETINGBAAS_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - aria_net

  # ── MYSQL DATABASE ──────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: aria_mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_secret}
      - MYSQL_DATABASE=${DB_DATABASE:-aria_platform}
      - MYSQL_USER=${DB_USERNAME:-aria_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-aria_secret}
    volumes:
      - aria_mysql_data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aria_net

  # ── REDIS CACHE ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aria_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - aria_redis_data:/data
    networks:
      - aria_net

  # ── PHPMYADMIN ──────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: aria_phpmyadmin
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=mysql
      - PMA_USER=aria_user
      - PMA_PASSWORD=aria_secret
    depends_on:
      - mysql
    networks:
      - aria_net

networks:
  aria_net:
    driver: bridge

volumes:
  aria_mysql_data:
  aria_redis_data:
